apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexor-api
  namespace: nexor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexor-api
  template:
    metadata:
      labels:
        app: nexor-api
    spec:
      containers:
      - name: nexor-api
        image: nexor-api:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: nexor-config
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nexor-api
  namespace: nexor
spec:
  type: NodePort
  selector:
    app: nexor-api
  ports:
  - port: 8080
    nodePort: 30002
---
