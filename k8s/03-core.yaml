apiVersion: apps/v1
kind: Deployment
metadata:
  name: olympus-api
  namespace: olympus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: olympus-api
  template:
    metadata:
      labels:
        app: olympus-api
    spec:
      containers:
      - name: olympus-api
        image: olympus-olympus-api:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: olympus-config
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: olympus-api
  namespace: olympus
spec:
  type: NodePort
  selector:
    app: olympus-api
  ports:
  - port: 8080
    nodePort: 30002
---
