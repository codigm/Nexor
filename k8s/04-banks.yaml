apiVersion: apps/v1
kind: Deployment
metadata:
  name: helios-bank
  namespace: nexor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helios-bank
  template:
    metadata:
      labels:
        app: helios-bank
    spec:
      containers:
      - name: helios-bank
        image: helios-bank:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: nexor-config
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: helios-bank
  namespace: nexor
spec:
  type: NodePort
  selector:
    app: helios-bank
  ports:
  - port: 8080
    nodePort: 30003
---
