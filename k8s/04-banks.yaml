apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-bank
  namespace: olympus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpha-bank
  template:
    metadata:
      labels:
        app: alpha-bank
    spec:
      containers:
      - name: alpha-bank
        image: olympus-alpha-bank:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: olympus-config
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: alpha-bank
  namespace: olympus
spec:
  type: NodePort
  selector:
    app: alpha-bank
  ports:
  - port: 8080
    nodePort: 30003
---
