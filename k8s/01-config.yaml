apiVersion: v1
kind: Namespace
metadata:
  name: nexor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexor-config
  namespace: nexor
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "nexor"
  DB_PASSWORD: "nexor_password"
  DB_NAME: "nexor_db"
  REDIS_ADDR: "redis:6379"
  KAFKA_BROKERS: "kafka:9092"
  JAEGER_ENDPOINT: "jaeger:4318"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "nexor_neo4j"
  SPRING_PROFILES_ACTIVE: "docker"
  NODE_ENV: "development"

