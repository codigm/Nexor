apiVersion: v1
kind: Namespace
metadata:
  name: olympus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olympus-config
  namespace: olympus
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "olympus"
  DB_PASSWORD: "olympus_password"
  DB_NAME: "olympus_db"
  REDIS_ADDR: "redis:6379"
  KAFKA_BROKERS: "kafka:9092"
  JAEGER_ENDPOINT: "jaeger:4318"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "olympus_neo4j"
  SPRING_PROFILES_ACTIVE: "docker"
  NODE_ENV: "development"
