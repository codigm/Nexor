apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: olympus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: olympus-dashboard:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: olympus-config
        ports:
        - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: olympus
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
  - port: 5173
    nodePort: 30000
