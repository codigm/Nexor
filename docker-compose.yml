version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: nexor-postgres
    environment:
      POSTGRES_USER: nexor
      POSTGRES_PASSWORD: nexor_password
      POSTGRES_DB: nexor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexor -d nexor_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: nexor-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  neo4j:
    image: neo4j:5-community
    container_name: nexor-neo4j
    environment:
      NEO4J_AUTH: neo4j/nexor_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: nexor-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: nexor-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: nexor-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.0.3
    container_name: nexor-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nexor-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    logging: *default-logging

  # ==========================================
  # BANKS
  # ==========================================
  helios-bank:
    build:
      context: ./banks
      dockerfile: helios-bank/Dockerfile
    container_name: helios-bank
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging

  orion-bank:
    build:
      context: ./banks
      dockerfile: orion-bank/Dockerfile
    container_name: orion-bank
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging

  vesper-bank:
    build:
      context: ./banks
      dockerfile: vesper-bank/Dockerfile
    container_name: vesper-bank
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging

  # ==========================================
  # NEXOR CORE SERVICES
  # ==========================================
  nexor-api:
    build:
      context: ./nexor-api
      dockerfile: Dockerfile
    container_name: nexor-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging

  perihelion-core:
    build:
      context: ./perihelion
      dockerfile: Dockerfile
    container_name: perihelion-core
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=nexor
      - DB_PASSWORD=nexor_password
      - DB_NAME=nexor_db
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
      - JAEGER_ENDPOINT=jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging

  synapse-core:
    build:
      context: ./synapse
      dockerfile: Dockerfile
    container_name: synapse-core
    ports:
      - "8085:8085"
    environment:
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging

  flux-core:
    build:
      context: ./flux
      dockerfile: Dockerfile
    container_name: flux-core
    ports:
      - "4000:4000"
    environment:
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging: *default-logging

  parallax-core:
    build:
      context: .
      dockerfile: ./parallax/Dockerfile
    container_name: parallax-core
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=nexor
      - DB_PASSWORD=nexor_password
      - DB_NAME=nexor_db
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
      - JAEGER_ENDPOINT=jaeger:4318
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexor_neo4j
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    logging: *default-logging

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: nexor-dashboard
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    depends_on:
      - flux-core
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  prometheus_data:
  grafana_data:
