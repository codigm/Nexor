server:
  port: 8080

spring:
  application:
    name: nexor-api
  cloud:
    gateway:
      routes:
        - id: helios-bank
          uri: http://helios-bank:8080
          predicates:
            - Path=/helios/**
          filters:
            - RewritePath=/helios/(?<segment>.*), /$\{segment}
        - id: orion-bank
          uri: http://orion-bank:8080
          predicates:
            - Path=/orion/**
          filters:
            - RewritePath=/orion/(?<segment>.*), /$\{segment}
        - id: vesper-bank
          uri: http://vesper-bank:8080
          predicates:
            - Path=/vesper/**
          filters:
            - RewritePath=/vesper/(?<segment>.*), /$\{segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
